<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вход — Электроника Волгодонска</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔌</text></svg>">
  <link rel="manifest" href="/volgodonsk/manifest.json">
  <meta name="theme-color" content="#4caf50">
  <link rel="stylesheet" href="/volgodonsk/css/login.css">
</head>
<body>
  <div class="login-container">
    <div class="logo">🔌</div>
    <h1>Вход в клуб</h1>
    <p class="subtitle">Электроника Волгодонска</p>
    
        <form id="loginForm">
      <div class="form-group">
        <label>Логин</label>
        <input type="text" id="login" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <div class="password-wrapper">
          <input type="text" id="password" required autocomplete="current-password">
          <button type="button" class="btn-eye" onclick="togglePassword('password', this)">🙈</button>
        </div>
      </div>
      <button type="submit" class="btn" id="loginBtn">🔑 Войти</button>
      <div id="errorMessage" class="error"></div>
      
      <!-- Кнопка восстановления пароля -->
      <div class="forgot-password">
        <a href="#" id="forgotPasswordLink">Забыли пароль?</a>
      </div>
    </form>

    <!-- Модальное окно восстановления пароля -->
    <div id="forgotModal" class="modal hidden">
      <div class="modal-content">
        <h3>🔐 Восстановление пароля</h3>
        <p>Введите email, указанный при регистрации. Мы отправим временный пароль.</p>
        <form id="forgotForm">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="forgotEmail" required placeholder="example@mail.ru">
          </div>
          <button type="submit" class="btn" id="forgotBtn">📧 Отправить временный пароль</button>
          <div id="forgotMessage" class="status"></div>
        </form>
        <button id="closeForgotBtn" class="btn-cancel">Закрыть</button>
      </div>
    </div>

    <!-- Модальное окно ввода нового пароля -->
    <div id="resetModal" class="modal hidden">
      <div class="modal-content">
        <h3>🔑 Установка нового пароля</h3>
		<p id="resetEmailHint" style="color:#666;font-size:14px;margin-bottom:10px;"></p>
        <p>Введите временный пароль из письма и придумайте новый.</p>
        <form id="resetForm">
          <div class="form-group">
            <label>Временный пароль</label>
            <input type="text" id="tempPassword" required placeholder="Введите код из письма">
          </div>
          <div class="form-group">
            <label>Новый пароль (минимум 6 символов)</label>
            <input type="text" id="newPassword" required minlength="6">
          </div>
          <button type="submit" class="btn" id="resetBtn">✅ Установить новый пароль</button>
          <div id="resetMessage" class="status"></div>
        </form>
        <button id="closeResetBtn" class="btn-cancel">Закрыть</button>
      </div>
    </div>
    
    <div class="links">
      <a href="/volgodonsk/">← На главную</a>
    </div>
   </div> 
  <script src="/volgodonsk/js/login.js"></script>
</body>
</html>
