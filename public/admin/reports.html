<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — Жалобы</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>🛡️ Жалобы пользователей</h1>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <a href="cleanup.html" class="back-link" style="background:#3390ec;color:white;padding:8px 14px;border-radius:6px;text-decoration:none;">🛠️ Обслуживание БД</a>
                <a href="users.html" class="back-link" style="background:#3390ec;color:white;padding:8px 14px;border-radius:6px;text-decoration:none;">👥 Пользователи</a>
                <a href="../chat.html" class="back-link">← В чат</a>
            </div>
        </header>

        <div id="reports-list" class="reports-list">
            <div class="loading">Загрузка жалоб...</div>
        </div>
    </div>

    <script type="module">
        import { apiFetch, requireAdmin, escapeHtml } from './admin-common.js';

        requireAdmin();

        const reportsList = document.getElementById('reports-list');
        const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

        async function loadReports() {
            try {
                const resp = await apiFetch('/admin/reports');
                const data = await resp.json();

                if (!data.success || !data.reports || data.reports.length === 0) {
                    reportsList.innerHTML = '<div class="empty">Жалоб нет ✅</div>';
                    return;
                }

                reportsList.innerHTML = data.reports.map(r => {
                    const statusClass = r.status === 'reviewed' ? 'status-reviewed' :
                                        r.status === 'dismissed' ? 'status-dismissed' : '';
                    const statusText = r.status === 'new' ? '🆕 Новая' :
                                       r.status === 'pending' ? '🕓 В ожидании' :
                                       r.status === 'reviewed' ? '✅ Рассмотрено' : '❌ Отклонено';
                    const date = new Date(r.created_at).toLocaleString('ru-RU');

                    // data-атрибуты — безопасно для любых имён (escapeHtml в атрибуте валиден).
                    return `
                        <div class="report-card ${statusClass}">
                            <div class="report-header">
                                <span class="report-status">${statusText}</span>
                                <span class="report-date">${escapeHtml(date)}</span>
                            </div>
                            <div class="report-info">
                                <div class="info-row"><strong>Жалобщик:</strong> ${escapeHtml(r.reporter_name || 'Неизвестно')}</div>
                                <div class="info-row"><strong>На пользователя:</strong> ${escapeHtml(r.reported_name || 'Неизвестно')}</div>
                                <div class="info-row"><strong>Причина:</strong> ${escapeHtml(r.reason || '—')}</div>
                                ${r.comment ? `<div class="info-row"><strong>Комментарий:</strong> ${escapeHtml(r.comment)}</div>` : ''}
                            </div>
                            ${r.message_text || r.message_image ? `
                                <div class="message-preview">
                                    <strong>Сообщение:</strong>
                                    <div class="message-text">${escapeHtml(r.message_text || '')}</div>
                                    ${r.message_image ? `<img src="${escapeHtml(r.message_image)}" alt="Изображение">` : ''}
                                </div>
                            ` : ''}
                            <div class="report-actions">
                                <button class="btn btn-review" data-act="status" data-id="${escapeHtml(String(r.id))}" data-status="reviewed">✓ Рассмотрено</button>
                                <button class="btn btn-dismiss" data-act="status" data-id="${escapeHtml(String(r.id))}" data-status="dismissed">✗ Отклонить</button>
                                <button class="btn btn-delete" data-act="delete-message" data-id="${escapeHtml(String(r.id))}">🗑 Удалить сообщение</button>
                                <button class="btn btn-ban" data-act="ban" data-id="${escapeHtml(String(r.id))}">🚫 Забанить</button>
                                ${r.reporter_id && r.reported_user_id && UUID_RE.test(r.reporter_id) && UUID_RE.test(r.reported_user_id) ? `
                                    <button class="btn btn-view-chat"
                                        data-act="view-chat"
                                        data-u1="${escapeHtml(r.reporter_id)}"
                                        data-u2="${escapeHtml(r.reported_user_id)}"
                                        data-n1="${escapeHtml(r.reporter_name || '')}"
                                        data-n2="${escapeHtml(r.reported_name || '')}">🔍 Просмотреть диалог</button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

                reportsList.querySelectorAll('[data-act]').forEach(btn => {
                    btn.addEventListener('click', () => handleAction(btn));
                });
            } catch (e) {
                reportsList.innerHTML = `<div class="error">Ошибка загрузки</div>`;
            }
        }

        async function handleAction(btn) {
            const { act, id } = btn.dataset;
            try {
                if (act === 'status') {
                    const r = await apiFetch(`/admin/reports/${encodeURIComponent(id)}/status`, {
                        method: 'POST', body: JSON.stringify({ status: btn.dataset.status })
                    });
                    if (r.ok) loadReports(); else alert('Ошибка');
                } else if (act === 'delete-message') {
                    if (!confirm('Удалить сообщение из жалобы?')) return;
                    const r = await apiFetch(`/admin/reports/${encodeURIComponent(id)}/delete-message`, { method: 'POST' });
                    const d = await r.json().catch(() => ({}));
                    if (r.ok) loadReports(); else alert(d.error || 'Ошибка');
                } else if (act === 'ban') {
                    if (!confirm('Забанить пользователя из жалобы?')) return;
                    const r = await apiFetch(`/admin/reports/${encodeURIComponent(id)}/ban-user`, { method: 'POST' });
                    const d = await r.json().catch(() => ({}));
                    if (r.ok) loadReports(); else alert(d.error || 'Ошибка');
                } else if (act === 'view-chat') {
                    const { u1, u2, n1, n2 } = btn.dataset;
                    window.location.href = `chat-view.html?user1=${encodeURIComponent(u1)}&user2=${encodeURIComponent(u2)}&name1=${encodeURIComponent(n1)}&name2=${encodeURIComponent(n2)}`;
                }
            } catch (e) { alert('Ошибка сети'); }
        }

        loadReports();
    </script>
</body>
</html>
